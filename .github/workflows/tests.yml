name: Tests

# Runs the full pytest suite (431 tests, about 13 min serial; split over the
# runner's cores with pytest-xdist). Several tests replay committed runs bit for
# bit, so requirements.txt pins the versions in the project's local .conda
# environment. When that environment is upgraded, update the pins there in the
# same change.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - docs/**
      - assets/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -n auto
